name: futsal_mobile
description: Futsal Booking Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  http: ^1.6.0

  webview_flutter: ^4.4.0

  url_launcher: ^6.2.4 
  
  # HTTP client
  dio: ^5.3.2
  
  # State management
  provider: ^6.0.5
  
  # Local storage
  shared_preferences: ^2.2.1
  
  # Calendar
  table_calendar: ^3.0.9
  
  # Date formatting
  intl: ^0.18.1
  
  # Images
  cached_network_image: ^3.3.0
  
  # Ratings
  flutter_rating_bar: ^4.0.1
  
  # Location
  geolocator: ^10.1.0
  
  # Image picker
  image_picker: ^1.0.4
  http_parser: ^4.1.2
  fl_chart: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true